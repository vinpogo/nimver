name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch dependencies
        # Writes nimble.paths, which config.nims hands to the plain `nim`
        # invocations below: with a lock file present, nim does not search the
        # nimble package directory by itself.
        run: nimble setup -y

      - name: Build nimver
        run: nimble build -y

      - name: Run test suites
        run: |
          failed=()
          for suite in tests/test_*.nim; do
            echo "::group::$suite"
            if ! nim c -r --hints:off --verbosity:0 --path:src "$suite"; then
              failed+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'failed: %s\n' "${failed[@]}"
            exit 1
          fi

  npm:
    # A pull request smoke tests the package on Linux only; main gets every
    # platform from `package`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Fetch dependencies
        # Writes nimble.paths, which config.nims hands to the plain `nim`
        # invocations below: with a lock file present, nim does not search the
        # nimble package directory by itself.
        run: nimble setup -y

      - name: Build the binary under its release name
        # bin/nimver.mjs picks the binary by its release asset name.
        run: |
          nimble buildBinary -y
          mv dist/nimver dist/nimver-linux-amd64

      - name: Pack
        run: |
          mkdir package
          npm pack --pack-destination package

      - name: Install and use the package
        run: .github/workflows/smoke_npm.sh package/vingy-nimver-*.tgz

  package:
    if: github.event_name == 'push'
    uses: ./.github/workflows/package.yml
