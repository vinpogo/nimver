name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the job that creates the release gets write.
permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds link musl statically, so one binary runs on glibc and
        # Alpine alike. The Intel macOS binary is cross-compiled on Apple
        # silicon.
        include:
          - os: ubuntu-24.04
            target: linux-amd64
            musl: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            musl: true
          - os: macos-26
            target: macos-arm64
          - os: macos-26
            target: macos-amd64
            nimflags: --cpu:amd64 --passC:"-arch x86_64" --passL:"-arch x86_64"
          - os: windows-2025
            target: windows-amd64
            extension: .exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch dependencies
        # Writes nimble.paths, which config.nims hands to the plain `nim`
        # invocations below: with a lock file present, nim does not search the
        # nimble package directory by itself.
        run: nimble setup -y

      - name: Install musl
        if: matrix.musl
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Build binary
        shell: bash
        env:
          NIMVER_NIMFLAGS: ${{ matrix.musl && '--gcc.exe:musl-gcc --gcc.linkerexe:musl-gcc --passL:-static' || matrix.nimflags }}
        run: nimble buildBinary -y

      - name: Name the artifact after its target
        shell: bash
        run: mv "dist/nimver${{ matrix.extension }}" "dist/nimver-${{ matrix.target }}${{ matrix.extension }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nimver-${{ matrix.target }}
          path: dist/nimver-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error

  npm:
    name: npm
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC token npm trusted publishing authenticates with.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that can publish via OIDC
        # Trusted publishing needs npm >= 11.5.1; what Node ships with is not
        # guaranteed to be recent enough.
        run: npm install -g npm@latest

      # The package ships the release binaries as they are, picked by
      # bin/nimver.mjs at run time.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Restore the executable bit
        # Artifacts lose it on upload, and npm packs files with the mode they
        # have on disk.
        run: chmod +x dist/nimver-*

      - name: Smoke test the package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/vingy-nimver-*.tgz
          npx nimver version

      - name: Check what would be published
        run: npm pack --dry-run

      - name: Work out which track this tag is on
        # `v1.2.0-alpha.1` is a prerelease on track `alpha`; `v1.2.0` is a
        # release. Everything after the version's `-`, up to the iteration.
        id: track
        shell: bash
        run: |
          suffix="${GITHUB_REF_NAME##*-}"
          if [ "$suffix" = "$GITHUB_REF_NAME" ]; then
            echo "name=" >> "$GITHUB_OUTPUT"
          else
            echo "name=${suffix%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        # Authentication is the OIDC trusted publisher configured on npmjs.com,
        # so there is no token to leak here. Provenance comes with it; the flag
        # is kept so an unattested publish fails rather than passing quietly.
        #
        # A prerelease goes to a dist-tag named after its track. npm does not
        # infer that from the version, so without `--tag` an alpha would become
        # what `npm install @vingy/nimver` gives everyone.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "${{ steps.track.outputs.name }}" ]; then
            npm publish --provenance --access public --tag "${{ steps.track.outputs.name }}"
          else
            npm publish --provenance --access public
          fi

  publish:
    name: github release
    needs: [binaries, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creating the release and uploading its binaries.
    steps:
      # Before the download: checkout cleans the workspace it checks out into.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract this version's changelog entry
        # With the binary this release ships, so the notes are its first use.
        # Artifacts lose the executable bit on upload. Written outside
        # `artifacts/`, which is uploaded to the release wholesale.
        run: |
          chmod +x artifacts/nimver-linux-amd64
          artifacts/nimver-linux-amd64 changelog "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # A tag carrying a track is a prerelease, and GitHub should say so
          # rather than offer it as the latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
